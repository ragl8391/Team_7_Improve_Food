{% extends "base.html" %}
{% block title %}Checkout - Improve Food{% endblock %}
{% block content %}
<div class="checkout-page">
    <h1>Checkout</h1>

    <p class="order-total">Order Total: ${{ "%.2f"|format(order_total) }}</p>

    <div class="fulfillment-choice">
        <button type="button" id="pickup-btn" class="btn-secondary">Pickup</button>
        <button type="button" id="delivery-btn" class="btn-secondary">Delivery</button>
    </div>

    <!-- Shown only if user picks Delivery -->
    <div id="delivery-section" style="display:none;">
        <button type="button" id="use-location-btn" class="btn-primary">Use my current location</button>
        <p id="location-status"></p>

        <form id="checkout-form" action="{{ url_for('confirm_claim') }}" method="post" style="display:none;">
            <input type="hidden" name="fulfillment_type" value="delivery">
            <input type="hidden" id="user_lat" name="user_lat">
            <input type="hidden" id="user_lon" name="user_lon">

            <label for="address">Delivery Address</label>
            <input type="text" id="address" name="address" placeholder="Street address" required>

            <label for="time_window">Delivery Time</label>
            <select id="time_window" name="time_window" required>
                <option value="">Select a time window</option>
                <!-- Placeholder: populate real available windows -->
                <option value="5:00-5:30pm">5:00 - 5:30 PM</option>
                <option value="5:30-6:00pm">5:30 - 6:00 PM</option>
            </select>

            <button type="submit" class="btn-primary">Confirm Order</button>
        </form>
    </div>

    <!-- Shown only if user picks Pickup -->
    <div id="pickup-section" style="display:none;">
        <form action="{{ url_for('confirm_claim') }}" method="post">
            <input type="hidden" name="fulfillment_type" value="pickup">

            <label for="pickup_time">Pickup Time</label>
            <select id="pickup_time" name="time_window" required>
                <option value="">Select a time window</option>
                <option value="5:00-5:30pm">5:00 - 5:30 PM</option>
                <option value="5:30-6:00pm">5:30 - 6:00 PM</option>
            </select>

            <button type="submit" class="btn-primary">Confirm Order</button>
        </form>
    </div>
</div>

<script>
document.getElementById("pickup-btn").addEventListener("click", () => {
    document.getElementById("pickup-section").style.display = "block";
    document.getElementById("delivery-section").style.display = "none";
});

document.getElementById("delivery-btn").addEventListener("click", () => {
    document.getElementById("delivery-section").style.display = "block";
    document.getElementById("pickup-section").style.display = "none";
});

document.getElementById("use-location-btn").addEventListener("click", () => {
    const statusEl = document.getElementById("location-status");

    if (!navigator.geolocation) {
        statusEl.textContent = "Geolocation is not supported by your browser.";
        return;
    }

    statusEl.textContent = "Requesting your location...";

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // Item id should come from the cart/checkout context —
            // placeholder here, replace with real item id(s) from the cart
            const itemId = "{{ items[0]._id if items else '' }}";

            fetch("{{ url_for('check_radius') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    item_id: itemId,
                    user_lat: lat,
                    user_lon: lon
                })
            })
            .then((res) => res.json())
            .then((data) => {
                if (data.allowed) {
                    statusEl.textContent = `You're within delivery range (${data.distance_miles} mi).`;
                    document.getElementById("user_lat").value = lat;
                    document.getElementById("user_lon").value = lon;
                    document.getElementById("checkout-form").style.display = "block";
                } else {
                    statusEl.textContent = `Sorry, you're outside our delivery range (${data.distance_miles} mi away).`;
                    document.getElementById("checkout-form").style.display = "none";
                }
            })
            .catch(() => {
                statusEl.textContent = "Something went wrong checking delivery range. Please try again.";
            });
        },
        (error) => {
            statusEl.textContent = "Unable to get your location. Please allow location access or select Pickup instead.";
        }
    );
});
</script>
{% endblock %}
