{% extends "base.html" %}
{% block title %}Checkout - Improve Food{% endblock %}
{% block content %}
<div class="checkout-card">
    <h1>Checkout</h1>
    <p class="order-total">Order Total: ${{ "%.2f"|format(order_total) }}</p>

    <div class="fulfillment-toggle">
        <button type="button" id="pickup-btn" class="toggle-btn active">Pickup</button>
        <button type="button" id="delivery-btn" class="toggle-btn">Delivery</button>
    </div>

    <!-- Pickup flow -->
    <div id="pickup-section">
        <form method="post" class="auth-form">
            <input type="hidden" name="fulfillment_type" value="pickup">
            <label for="pickup_time">Pickup Time</label>
            <select id="pickup_time" name="time_window" required>
                <option value="">Select a time window</option>
                <!-- Placeholder: populate real available windows -->
                <option value="5:00-5:30pm">5:00 - 5:30 PM</option>
                <option value="5:30-6:00pm">5:30 - 6:00 PM</option>
            </select>
            <button type="submit" class="btn-primary">Confirm Order</button>
        </form>
    </div>

    <!-- Delivery flow -->
    <div id="delivery-section" style="display:none;">
        <button type="button" id="use-location-btn" class="btn-primary">Use my current location</button>
        <div id="radius-message" class="radius-message hidden"></div>
    </div>
</div>

<!-- Delivery address modal, shown only after radius check passes -->
<div id="delivery-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
        <h2>Delivery Details</h2>
        <form id="checkout-form" method="post">
            <input type="hidden" name="fulfillment_type" value="delivery">
            <input type="hidden" id="user_lat" name="user_lat">
            <input type="hidden" id="user_lon" name="user_lon">

            <label for="address">Delivery Address</label>
            <input type="text" id="address" name="address" placeholder="Street address" required>

            <label for="time_window">Delivery Time</label>
            <select id="time_window" name="time_window" required>
                <option value="">Select a time window</option>
                <option value="5:00-5:30pm">5:00 - 5:30 PM</option>
                <option value="5:30-6:00pm">5:30 - 6:00 PM</option>
            </select>

            <div class="modal-actions">
                <button type="button" id="cancel-delivery-btn" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-primary">Confirm Order</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const pickupBtn = document.getElementById("pickup-btn");
const deliveryBtn = document.getElementById("delivery-btn");
const pickupSection = document.getElementById("pickup-section");
const deliverySection = document.getElementById("delivery-section");
const modalOverlay = document.getElementById("delivery-modal-overlay");
const radiusMessage = document.getElementById("radius-message");

pickupBtn.addEventListener("click", () => {
    pickupBtn.classList.add("active");
    deliveryBtn.classList.remove("active");
    pickupSection.style.display = "block";
    deliverySection.style.display = "none";
});

deliveryBtn.addEventListener("click", () => {
    deliveryBtn.classList.add("active");
    pickupBtn.classList.remove("active");
    deliverySection.style.display = "block";
    pickupSection.style.display = "none";
});

document.getElementById("cancel-delivery-btn").addEventListener("click", () => {
    modalOverlay.classList.add("hidden");
});

document.getElementById("use-location-btn").addEventListener("click", () => {
    radiusMessage.classList.remove("hidden", "allowed", "blocked");
    radiusMessage.textContent = "Requesting your location...";

    if (!navigator.geolocation) {
        radiusMessage.textContent = "Geolocation is not supported by your browser.";
        radiusMessage.classList.add("blocked");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // Item id should come from the cart/checkout context —
            // placeholder here, replace with real item id(s) from the cart
            const itemId = "{{ items[0]._id if items else '' }}";

            fetch("{{ url_for('check_radius') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    item_id: itemId,
                    user_lat: lat,
                    user_lon: lon
                })
            })
            .then((res) => res.json())
            .then((data) => {
                if (data.allowed) {
                    radiusMessage.textContent = `You're within delivery range (${data.distance_miles} mi).`;
                    radiusMessage.classList.add("allowed");
                    document.getElementById("user_lat").value = lat;
                    document.getElementById("user_lon").value = lon;
                    modalOverlay.classList.remove("hidden");
                } else {
                    radiusMessage.textContent = `Sorry, you're outside our delivery range (${data.distance_miles} mi away).`;
                    radiusMessage.classList.add("blocked");
                }
            })
            .catch(() => {
                radiusMessage.textContent = "Something went wrong checking delivery range. Please try again.";
                radiusMessage.classList.add("blocked");
            });
        },
        () => {
            radiusMessage.textContent = "Unable to get your location. Please allow location access or select Pickup instead.";
            radiusMessage.classList.add("blocked");
        }
    );
});
</script>
{% endblock %}
